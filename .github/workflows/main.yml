name: Daily Stock Data Crawler

on:
  schedule:
    # 💡 國際標準時間 UTC 10:30 = 台北時間 18:30
    - cron: '30 10 * * *'
  workflow_dispatch: # 允許你隨時手動點擊按鈕測試

permissions:
  contents: write # 賦予排程權限，讓它能把寫好的 CSV 推回你的專案

jobs:
  run_spider:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 檢查並載入程式碼
        uses: actions/checkout@v4

      - name: 2. 初始化 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. 安裝必要套件
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy yfinance

      - name: 4. 執行背景爬蟲腳本
        run: python fetch_data.py

      - name: 5. 自動將產出的 stock_data.csv 提交儲存回 GitHub 倉庫
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add stock_data.csv
          # 檢查檔案是否有變動，有變動才提交，避免無效報錯
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 自動更新每日台股數據: $(date +'%Y-%m-%d %H:%M:%S')" && git push)
